name: Build Debug APK

# 手动触发：仓库 Actions 页 → 该工作流 → Run workflow
# 用于绕过小米对 SmsForwarder 官方旧版签名的风险拦截：
#   1) 用 GitHub runner 自动生成的 debug key 签名（全新签名，不在黑名单）
#   2) 配合 app/build.gradle 把 applicationId 改成 com.idormy.sms.forwarder
#      → 设备上残留的通知监听条目自动激活，无需任何权限操作
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # 官方工作流打 release 需要 pppscn 的私钥仓库（fork 里没有 secrets，必须去掉）
      # 这里改打 debug 包：签名自动用 runner 的 debug key
      - name: Build Debug APK
        run: bash ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmsF_debug_apk
          path: '**/outputs/apk/debug/*.apk'
